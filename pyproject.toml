[project]
name = "opencode-knowledge-base"
version = "0.1.0"
description = "Local hybrid (SQLite FTS5 + Ollama embeddings) knowledge base MCP server for OpenCode"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
]

[project.scripts]
ockb = "ockb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ockb"]

[dependency-groups]
dev = ["pytest>=8"]
